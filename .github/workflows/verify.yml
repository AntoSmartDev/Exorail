name: Verify

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: verify-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os:
          - ubuntu-latest
          - windows-latest
          - macos-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v6
        with:
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 24
          package-manager-cache: false

      - name: Verify Exorail payload manifest
        run: node .exorail/tools/generate-payload-manifest.mjs --check

      - name: Exercise documented Bash installation
        if: matrix.os == 'ubuntu-latest'
        shell: bash
        run: |
          set -euo pipefail
          target="$(mktemp -d)"
          trap 'rm -rf "$target"' EXIT
          mkdir -p "$target/.exorail"
          printf 'legacy record\n' > "$target/.exorail/OLD_RECORD.md"
          awk '/^```bash$/{inside=1; next} inside && /^```$/{exit} inside {print}' README.md |
            sed "s|^target=/path/to/target-repository$|target='$target'|" |
            bash
          test -f "$target/AGENTS.md"
          test -f "$target/.exorail/AGENTS.md"
          test ! -e "$target/.exorail/.exorail"
          retired=("$target"/.exorail-retired-*)
          test "${#retired[@]}" -eq 1
          test -f "${retired[0]}/OLD_RECORD.md"

      - name: Validate workflow state
        run: node .exorail/tools/validate-workflow.mjs

      - name: Validate public text files
        run: node .exorail/tools/validate-text-files.mjs AGENTS.md CLAUDE.md .exorail/AGENTS.md
