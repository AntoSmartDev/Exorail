<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 386" width="880" height="386" role="img" aria-labelledby="title desc">
  <title id="title">ExoRail Project Memory as connected records</title>
  <desc id="desc">Decision affects Story, Story contains Task, Task produces Result. Below them, plan revisions supersede future work, dependencies hold and release, and receipts bind the reviewed commit. A closing band states that Project Memory is selective, not a transcript.</desc>

  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path class="ah" d="M 0 0 L 10 5 L 0 10 z"/>
    </marker>
  </defs>
  <style>
    text { font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; }
    .head { font-size: 19px; font-weight: 700; fill: #1f2933; }
    .stage { font-size: 15px; font-weight: 600; fill: #1f2933; }
    .body { font-size: 13.5px; fill: #1f2933; }
    .note { font-size: 12.5px; fill: #52606d; }
    .key { font-size: 12px; fill: #52606d; }
    .mono { font-family: ui-monospace, SFMono-Regular, Consolas, monospace; font-size: 12.5px; fill: #52606d; }
    .box { fill: #3f6fb5; fill-opacity: .07; stroke: #3f6fb5; stroke-width: 2; }
    .boxh { fill: #b5762f; fill-opacity: .09; stroke: #b5762f; stroke-width: 2; }
    .boxm { fill: #7a8699; fill-opacity: .06; stroke: #7a8699; stroke-width: 2; stroke-dasharray: 5 4; }
    .stop { fill: #3f6fb5; }
    .gate { fill: #b5762f; }
    .rail { stroke: #7a8699; stroke-width: 3; fill: none; }
    .arrow { stroke: #7a8699; stroke-width: 2; fill: none; marker-end: url(#a); }
    .ah { fill: #7a8699; }
    .blocked { stroke: #b5762f; stroke-width: 2.5; fill: none; stroke-dasharray: 6 5; }
    .cross { stroke: #b5762f; stroke-width: 2.5; stroke-linecap: round; }
    @media (prefers-color-scheme: dark) {
      .head, .stage, .body { fill: #e6edf3; }
      .note, .key, .mono { fill: #9aa7b4; }
      .box { fill: #6ea8fe; fill-opacity: .12; stroke: #6ea8fe; }
      .boxh { fill: #e0a34a; fill-opacity: .14; stroke: #e0a34a; }
      .boxm { fill: #8b98a5; fill-opacity: .10; stroke: #8b98a5; }
      .stop { fill: #6ea8fe; }
      .gate { fill: #e0a34a; }
      .rail, .arrow { stroke: #8b98a5; }
      .ah { fill: #8b98a5; }
      .blocked, .cross { stroke: #e0a34a; }
    }
  </style>

  <text class="head" x="40" y="34">Project Memory: connected records, not a database</text>
  <text class="note" x="40" y="58">Markdown and Git only — no graph engine, vector store or hosted service.</text>
  <rect class="box" x="40" y="96" width="150" height="56" rx="8"/>
  <text class="body" x="115.0" y="120" text-anchor="middle">Decision</text>
  <text class="note" x="115.0" y="139" text-anchor="middle">human authority</text>
  <rect class="box" x="250" y="96" width="150" height="56" rx="8"/>
  <text class="body" x="325.0" y="120" text-anchor="middle">User Story</text>
  <text class="note" x="325.0" y="139" text-anchor="middle">intent + acceptance</text>
  <rect class="box" x="460" y="96" width="150" height="56" rx="8"/>
  <text class="body" x="535.0" y="120" text-anchor="middle">Task</text>
  <text class="note" x="535.0" y="139" text-anchor="middle">scope + isolation</text>
  <rect class="box" x="670" y="96" width="170" height="56" rx="8"/>
  <text class="body" x="755.0" y="120" text-anchor="middle">Result</text>
  <text class="note" x="755.0" y="139" text-anchor="middle">immutable evidence</text>
  <line class="arrow" x1="194" y1="124" x2="244" y2="124"/>
  <text class="key" x="220.0" y="114" text-anchor="middle">affects</text>
  <line class="arrow" x1="404" y1="124" x2="454" y2="124"/>
  <text class="key" x="430.0" y="114" text-anchor="middle">contains</text>
  <line class="arrow" x1="614" y1="124" x2="664" y2="124"/>
  <text class="key" x="640.0" y="114" text-anchor="middle">produces</text>
  <line class="arrow" x1="325.0" y1="206" x2="325.0" y2="158"/>
  <rect class="boxm" x="250" y="210" width="150" height="56" rx="8"/>
  <text class="body" x="325.0" y="234" text-anchor="middle">Plan revision</text>
  <text class="note" x="325.0" y="253" text-anchor="middle">replans future work</text>
  <line class="arrow" x1="535.0" y1="206" x2="535.0" y2="158"/>
  <rect class="boxm" x="460" y="210" width="150" height="56" rx="8"/>
  <text class="body" x="535.0" y="234" text-anchor="middle">Dependencies</text>
  <text class="note" x="535.0" y="253" text-anchor="middle">hold and release</text>
  <line class="arrow" x1="755.0" y1="206" x2="755.0" y2="158"/>
  <rect class="boxm" x="670" y="210" width="170" height="56" rx="8"/>
  <text class="body" x="755.0" y="234" text-anchor="middle">Receipt</text>
  <text class="note" x="755.0" y="253" text-anchor="middle">binds reviewed_sha</text>
  <rect class="boxm" x="40" y="300" width="800" height="62" rx="8"/>
  <text class="body" x="56" y="326">Selective by design: only material project meaning enters the record.</text>
  <text class="note" x="56" y="345">Prompts, tokens, tool calls, checkpoints and heartbeats stay runtime-owned and never enter it.</text>
</svg>
