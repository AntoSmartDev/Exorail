<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 458" width="880" height="458" role="img" aria-labelledby="title desc">
  <title id="title">Authoring is not authority</title>
  <desc id="desc">An agent may draft project records and ExoRail may validate admission, but neither operation supplies a protected decision. Task acceptance, Task integration and whole-Story outcome are distinct human-gated events, each requiring its own declared user authority-reference form. The repository checks the form but does not authenticate its human origin.</desc>
  <style>
    text { font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; }
    .head { font-size: 22px; font-weight: 700; fill: #172b40; }
    .sub { font-size: 14px; fill: #52677b; }
    .label { font-size: 12px; font-weight: 700; letter-spacing: 1.2px; fill: #47719d; }
    .stage { font-size: 16px; font-weight: 700; fill: #172b40; }
    .body { font-size: 13.5px; fill: #465b70; }
    .mono { font: 13px ui-monospace, SFMono-Regular, Consolas, monospace; fill: #465b70; }
    .card { fill: #f5f9ff; stroke: #7fb1e8; stroke-width: 1.5; }
    .amber { fill: #fff9f1; stroke: #bd803d; stroke-width: 1.5; }
    .quiet { fill: #f5f7fa; stroke: #d3dee9; stroke-width: 1.5; }
    .cross { stroke: #bd803d; stroke-width: 2.5; stroke-linecap: round; }
    @media (prefers-color-scheme: dark) {
      .head, .stage { fill: #edf5fc; }
      .sub, .body, .mono { fill: #bacbdd; }
      .label { fill: #86c4ff; }
      .card { fill: #142b42; stroke: #4d91d2; }
      .amber { fill: #332819; stroke: #dba15e; }
      .quiet { fill: #172431; stroke: #3a4d60; }
      .cross { stroke: #dba15e; }
    }
  </style>

  <text class="head" x="40" y="37">Authoring is not authority</text>
  <text class="sub" x="40" y="61">Writing a plausible record and passing deterministic checks are not protected decisions.</text>

  <text class="label" x="40" y="101">AGENT WORK AND MECHANICAL ADMISSION</text>
  <rect class="card" x="40" y="116" width="385" height="82" rx="10"/>
  <text class="stage" x="56" y="148">Agent drafts project records</text>
  <text class="body" x="56" y="174">Work, evidence, options and recommendations</text>
  <path d="M 429 157 H 451" stroke="#8197ab" stroke-width="2"/>
  <path d="M 451 157 l -8 -5 v 10 Z" fill="#8197ab"/>
  <rect class="quiet" x="455" y="116" width="385" height="82" rx="10"/>
  <text class="stage" x="471" y="148">ExoRail checks admission</text>
  <text class="body" x="471" y="174">Schema, Policy, dependencies and current state</text>

  <rect class="quiet" x="40" y="215" width="800" height="50" rx="10"/>
  <line class="cross" x1="57" y1="232" x2="73" y2="248"/>
  <line class="cross" x1="73" y1="232" x2="57" y2="248"/>
  <text class="stage" x="88" y="246">Neither operation creates a protected authority reference.</text>

  <text class="label" x="40" y="300">SEPARATE HUMAN-GATED PROJECT EVENTS</text>
  <rect class="amber" x="40" y="314" width="250" height="67" rx="10"/>
  <text class="stage" x="56" y="342">Task acceptance</text>
  <text class="body" x="56" y="365">Accepts Result evidence</text>
  <rect class="amber" x="315" y="314" width="250" height="67" rx="10"/>
  <text class="stage" x="331" y="342">Task integration</text>
  <text class="body" x="331" y="365">Binds an exact commit</text>
  <rect class="amber" x="590" y="314" width="250" height="67" rx="10"/>
  <text class="stage" x="606" y="342">Whole-Story outcome</text>
  <text class="body" x="606" y="365">Accepts the delivery slice</text>

  <text class="mono" x="40" y="411">Each protected event requires a declared user:&lt;decision-reference&gt; form.</text>
  <text class="body" x="40" y="438">The baseline checks that form; it does not attest human origin or prevent direct repository writes.</text>
</svg>
