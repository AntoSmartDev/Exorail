<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 458" width="880" height="458" role="img" aria-labelledby="title desc">
  <title id="title">Optional adapter use does not create authority</title>
  <desc id="desc">An optional delegated route depends on descriptor presence, Policy activation, local availability and invocation. A consequential external action additionally requires a declared user authority-reference form and an External Action record. An unavailable adapter does not block the complete native repository route.</desc>
  <style>
    text { font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; }
    .head { font-size: 22px; font-weight: 700; fill: #172b40; }
    .sub { font-size: 14px; fill: #52677b; }
    .label { font-size: 12px; font-weight: 700; letter-spacing: 1.2px; fill: #47719d; }
    .stage { font-size: 16px; font-weight: 700; fill: #172b40; }
    .body { font-size: 13.5px; fill: #465b70; }
    .mono { font: 13px ui-monospace, SFMono-Regular, Consolas, monospace; fill: #465b70; }
    .card { fill: #f5f9ff; stroke: #7fb1e8; stroke-width: 1.5; }
    .amber { fill: #fff9f1; stroke: #bd803d; stroke-width: 1.5; }
    .quiet { fill: #f5f7fa; stroke: #d3dee9; stroke-width: 1.5; }
    @media (prefers-color-scheme: dark) {
      .head, .stage { fill: #edf5fc; }
      .sub, .body, .mono { fill: #bacbdd; }
      .label { fill: #86c4ff; }
      .card { fill: #142b42; stroke: #4d91d2; }
      .amber { fill: #332819; stroke: #dba15e; }
      .quiet { fill: #172431; stroke: #3a4d60; }
    }
  </style>

  <text class="head" x="40" y="37">Adapter availability is not permission</text>
  <text class="sub" x="40" y="61">Capability resolution and protected authority are different questions.</text>

  <text class="label" x="40" y="103">OPTIONAL DELEGATED ROUTE · DISTINCT CONDITIONS</text>
  <rect class="card" x="40" y="118" width="185" height="86" rx="10"/>
  <text class="stage" x="56" y="151">Presence</text>
  <text class="body" x="56" y="177">Descriptor exists</text>
  <rect class="card" x="245" y="118" width="185" height="86" rx="10"/>
  <text class="stage" x="261" y="151">Activation</text>
  <text class="body" x="261" y="177">Policy enables it</text>
  <rect class="card" x="450" y="118" width="185" height="86" rx="10"/>
  <text class="stage" x="466" y="151">Availability</text>
  <text class="body" x="466" y="177">Local binding + health</text>
  <rect class="card" x="655" y="118" width="185" height="86" rx="10"/>
  <text class="stage" x="671" y="151">Invocation</text>
  <text class="body" x="671" y="177">Only after resolution</text>

  <rect class="quiet" x="40" y="221" width="800" height="48" rx="10"/>
  <text class="body" x="56" y="250">If a condition fails, that delegated route stops. It does not invalidate the repository or grant permission.</text>

  <text class="label" x="40" y="301">ADDITIONAL GATE · CONSEQUENTIAL OR DESTRUCTIVE EXTERNAL ACTION</text>
  <rect class="amber" x="40" y="315" width="800" height="77" rx="10"/>
  <text class="stage" x="56" y="343">Declared authority and a durable External Action record</text>
  <text class="mono" x="56" y="369">declared user:&lt;decision-reference&gt; form · intent → classification → authority → invocation → evidence</text>

  <rect class="card" x="40" y="410" width="800" height="38" rx="10"/>
  <text class="stage" x="56" y="436">The native route remains complete with one coding agent and no adapter.</text>
</svg>
