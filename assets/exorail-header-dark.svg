<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 328" width="1280" height="328" role="img" aria-labelledby="title desc">
  <title id="title">ExoRail — Human-in-the-project</title>
  <desc id="desc">When Human-in-the-loop is not enough, you need Human-in-the-project. Agents have sessions; projects have lifecycles. Project intent, Results and decision history stay in the repository when the agent, model, harness or provider changes.</desc>
  <style>
    text { font-family: system-ui, -apple-system, "Segoe UI", Roboto, Arial, sans-serif; }
    .word { font-size: 34px; font-weight: 750; letter-spacing: -1.2px; fill: #f5f9fc; }
    .category { font-size: 16px; font-weight: 700; letter-spacing: 1.8px; fill: #b5c7d8; }
    .hero { font-size: 44px; font-weight: 750; letter-spacing: -1.1px; fill: #f5f9fc; }
    .tagline { font-size: 24px; font-weight: 600; letter-spacing: -.3px; fill: #f5f9fc; }
    .detail { font-size: 18px; fill: #c6d5e2; }
    .badge { font-size: 13px; font-weight: 700; letter-spacing: 1px; fill: #d7e8f5; }
  </style>
  <rect x="0.75" y="0.75" width="1278.5" height="326.5" rx="16" fill="#0d1927" stroke="#25394d" stroke-width="1.5"/>
  <g transform="translate(72 35)" fill="#29a2ff">
    <path d="M0 30 15 0h15L15 30Z"/>
    <path d="M21 30 36 0h15L36 30Z"/>
  </g>
  <text class="word" x="128" y="65">ExoRail</text>
  <line x1="274" y1="39" x2="274" y2="63" stroke="#43576b" stroke-width="1.5"/>
  <text class="category" x="293" y="58">AGENTIC DEVELOPMENT PLATFORM</text>
  <line x1="72" y1="85" x2="1208" y2="85" stroke="#263b4e"/>
  <text class="hero" x="72" y="136">When Human-in-the-loop is not enough,</text>
  <text class="hero" x="72" y="182">you need <tspan fill="#f0a94e">Human-in-the-project</tspan>.</text>
  <text class="tagline" x="72" y="224">Agents have sessions. Projects have lifecycles.</text>
  <text class="detail" x="72" y="256">Change the agent, model, harness or provider. Project intent, Results and decision history stay in the repository.</text>
  <g fill="#172b3e" stroke="#2a4055"><rect x="72" y="276" width="171" height="26" rx="13"/><rect x="253" y="276" width="163" height="26" rx="13"/><rect x="426" y="276" width="125" height="26" rx="13"/><rect x="561" y="276" width="337" height="26" rx="13"/></g>
  <text class="badge" x="85" y="294">REPOSITORY-NATIVE</text><text class="badge" x="266" y="294">HARNESS-NEUTRAL</text><text class="badge" x="439" y="294">LLM-NEUTRAL</text><text class="badge" x="574" y="294">PROJECT MEMORY · PAST / PRESENT / NEXT</text>
</svg>
